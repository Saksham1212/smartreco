{% extends "base.html" %}
{% block title %}{{ 'Edit' if product else 'New' }} Product — SmartReco{% endblock %}
{% block content %}
<section class="section">
  <div class="admin-nav">
    <a href="/admin" class="pill">Dashboard</a>
    <a href="/admin/products" class="pill pill-active">Products</a>
    <a href="/admin/events" class="pill">Events</a>
    <a href="/admin/recommendations" class="pill">Recommendations</a>
  </div>

  <h1 class="page-title">{{ 'Edit Product' if product else 'New Product' }}</h1>

  <form method="post" action="{{ '/admin/products/' + product.id|string + '/edit' if product else '/admin/products/new' }}" class="admin-form">
    <div class="form-row">
      <label for="title">Title</label>
      <input type="text" id="title" name="title" required value="{{ product.title if product else '' }}">
    </div>
    <div class="form-row">
      <label for="description">Description</label>
      <textarea id="description" name="description" required rows="5">{{ product.description if product else '' }}</textarea>
    </div>
    <div class="form-row form-row-split">
      <div>
        <label for="category">Category</label>
        <input type="text" id="category" name="category" required list="categoryOptions" value="{{ product.category if product else '' }}">
        <datalist id="categoryOptions">
          <option value="AI/ML"><option value="Web Development"><option value="Data Science">
          <option value="DevOps"><option value="Mobile Development">
        </datalist>
      </div>
      <div>
        <label for="difficulty_level">Difficulty</label>
        <select id="difficulty_level" name="difficulty_level" required>
          <option value="beginner" {% if product and product.difficulty_level == 'beginner' %}selected{% endif %}>Beginner</option>
          <option value="intermediate" {% if product and product.difficulty_level == 'intermediate' %}selected{% endif %}>Intermediate</option>
          <option value="advanced" {% if product and product.difficulty_level == 'advanced' %}selected{% endif %}>Advanced</option>
        </select>
      </div>
    </div>
    <div class="form-row form-row-split">
      <div>
        <label for="price">Price ($)</label>
        <input type="number" id="price" name="price" required min="0" step="0.01" value="{{ product.price if product else '' }}">
      </div>
      <div>
        <label for="duration_hours">Duration (hours)</label>
        <input type="number" id="duration_hours" name="duration_hours" required min="0" step="0.5" value="{{ product.duration_hours if product else '' }}">
      </div>
    </div>
    <div class="form-row">
      <label for="instructor_name">Instructor Name</label>
      <input type="text" id="instructor_name" name="instructor_name" value="{{ product.instructor_name if product else '' }}">
    </div>
    <div class="form-row">
      <label for="tags">Tags (comma-separated)</label>
      <input type="text" id="tags" name="tags" value="{{ product.tags if product else '' }}">
    </div>
    <div class="form-row">
      <label for="thumbnail_url">Thumbnail URL</label>
      <input type="url" id="thumbnail_url" name="thumbnail_url" value="{{ product.thumbnail_url if product and product.thumbnail_url else '' }}">
    </div>
    <div class="form-row form-row-checkbox">
      <label><input type="checkbox" name="is_active" {% if not product or product.is_active %}checked{% endif %}> Active (visible in catalog and search)</label>
    </div>
    <button type="submit" class="btn btn-accent">{{ 'Save Changes' if product else 'Create Product' }}</button>
  </form>
</section>
{% endblock %}
